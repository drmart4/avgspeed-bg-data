name: Обновяване на участъците

# Автоматичното седмично пускане е от Mac (tools/weekly_mac.sh), защото BG TOLL
# връща 403 на сървърите на GitHub. Тук остава само ръчно пускане.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сверка с BG TOLL и OpenStreetMap
        id: update
        run: python3 tools/update.py

      - name: Публикуване на новата версия
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "avgspeed-bot"
          git config user.email "avgspeed-bot@users.noreply.github.com"
          git add sections.json
          git commit -m "Участъци: $(python3 -c 'import json;print(json.load(open("sections.json"))["version"])')"
          git push
